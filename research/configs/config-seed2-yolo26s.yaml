# S5b — ULANGAN SEED: YOLO26s pada split bersih, seed 2.
#
# PERHATIAN — aturan di sini BERBEDA dari config-cmp-*.yaml.
# Yang bervariasi adalah `seed`, bukan `model`. Salinan byte-per-byte dari
# config-v21-clean.yaml KECUALI `seed` dan `name`; `model` HARUS tetap yolo26s.pt.
#
# Bersama seed 0 (run yolo26s_det_v21_clean yang sudah ada) dan seed 1, run ini melengkapi
# tiga ulangan - jumlah minimum yang memungkinkan pelaporan mean +- stdev dan uji berpasangan
# (Wilcoxon signed-rank lebih aman daripada t-test pada n sekecil ini).
#
# JANGAN melatih ulang seed 0: run yolo26s_det_v21_clean SUDAH ADA dan itulah seed 0-nya.
# Melatih ulang justru berisiko menghasilkan angka berbeda dari yang sudah dilaporkan.
#
# Jalankan:
#   uv run python scripts/train.py --config research/configs/config-seed2-yolo26s.yaml

model: yolo26s.pt                    # TETAP sama - jangan diubah
data: dataset_det_clean/data.yaml    # WAJIB dataset_det_clean (501/80/80), BUKAN dataset_det

# --- schedule ---
epochs: 200                    # small dataset -> train long, early stopping decides when to stop
patience: 50                   # stop if no validation improvement for this many epochs
imgsz: 640                     # keep at 640 to stay comparable with the baseline run

# --- hardware (RTX 4060 Ti, 8 GB) ---
device: 0                      # GPU index (0 = the RTX). train.py enforces a real CUDA device.
batch: 16                      # fits 8 GB; lower to 8 if you hit CUDA out-of-memory
# On Windows, workers>0 + cache=true can deadlock the dataloader at startup.
cache: false
workers: 0

# --- augmentation / optimization ---
close_mosaic: 10               # disable mosaic for the last N epochs (cleaner convergence)
cos_lr: true                   # cosine learning-rate decay
seed: 2                        # <-- SATU-SATUNYA perbedaan #1 (baseline memakai 0)

# --- output ---
project: runs                  # results go to runs/<name>/
name: yolo26s_det_v21_clean_seed2    # <-- SATU-SATUNYA perbedaan #2
